<!DOCTYPE html>
<html>
<head>
  <title>Robotics Clinic Portal</title>
</head>
<body>
  <h2>Robotics Clinic Feedback</h2>
  <form id="clinicForm">
    <label>Username:</label><br>
    <input type="text" name="username" required><br><br>

    <label>Likes:</label><br>
    <input type="text" name="likes"><br><br>

    <label>Membership:</label><br>
    <select name="membership">
      <option value="Basic">Basic</option>
      <option value="Premium">Premium</option>
      <option value="Guest">Guest</option>
    </select><br><br>

    <label>Comments:</label><br>
    <textarea name="comments"></textarea><br><br>

    <button type="submit">Submit</button>
  </form>

  <script>
    const scriptURL = "https://script.google.com/macros/s/AKfycbyM52qGu8sSFJw-8wTw2hZTFT9Wi2qMLODsG2MwjW3Bp4fc3GgCH_DUiNNKEbV4WvbazQ/exec";

    document.getElementById("clinicForm").addEventListener("submit", e => {
      e.preventDefault();
      const formData = new FormData(e.target);
      const data = Object.fromEntries(formData.entries());

      fetch(scriptURL, {
        method: "POST",
        body: JSON.stringify(data)
      })
      .then(res => alert("Submitted successfully!"))
      .catch(err => alert("Error: " + err));
    });
  </script>
</body>
</html>
